
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Service Application Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background: #f3f6fa;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 6px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #145da0;
            color: white;
            border: none;
            cursor: pointer;
        }

        #successMessage {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Government Service Portal</h1>
    <p>Demo form for Selenium automated testing</p>

    <form id="applicationForm">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="mobile">Mobile Number</label>
        <input type="text" id="mobile" name="mobile"
               pattern="[0-9]{10}"
               title="Enter a 10-digit mobile number" required>

        <label for="service">Service Required</label>
        <select id="service" name="service" required>
            <option value="">Select a service</option>
            <option value="Certificate Request">Certificate Request</option>
            <option value="Address Update">Address Update</option>
            <option value="Application Status">Application Status</option>
        </select>

        <label for="details">Application Details</label>
        <textarea id="details" name="details" rows="4" required></textarea>

        <button type="submit">Submit Application</button>
    </form>

    <p id="successMessage" role="status" hidden>
        Application submitted successfully.
    </p>

    <script>
        document.getElementById("applicationForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                this.hidden = true;
                document.getElementById("successMessage").hidden = false;
            });
    </script>
</body>
</html>
